<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>POS element-display</title>

    <!-- Utility framework -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/cds-snc/gcds-utilities/dist/gcds-utility.css"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    <!-- Font awesome 6 kit for this demo page. Anyone can create a free kit for open source. -->
    <script
      src="https://kit.fontawesome.com/892cb27850.js"
      crossorigin="anonymous"
    ></script>

    <!-- Local components -->
    <link rel="stylesheet" href="/dist/gcds/gcds.css" />
    <script type="module" src="/dist/gcds/gcds.esm.js"></script>
    <script nomodule src="/dist/gcds.js"></script>

    <style>
      html {
        font-size: 16px;
      }

      body {
        font-size: var(--gcds-font-sizes-text);
        line-height: var(--gcds-line-heights-text);
        color: var(--gcds-color-grayscale-1000);
        font-family: var(--gcds-font-families-body), sans-serif;
        margin: 0;
        animation: fade 0.05s normal forwards ease-in-out;
      }
    </style>
  </head>

  <body style="margin: 0">

    <gcds-container size="xl" main-container centered tag="main">
      <gcds-heading tag="h1">GC Design System</gcds-heading>

      <element-display
        slots='[
          {
            "name": "menu",
            "description": "The slot to place the main menu of the site"
          },
          {
            "name": "breadcrumb",
            "description": "The slot to place the breadcrumbs of the site"
          },
          {
            "name": "search",
            "description": "The slot to place the search of the site"
          }
        ]'
      >
        <gcds-header>
          <gcds-search slot="search"></gcds-search>
          <gcds-topic-menu slot="menu"></gcds-topic-menu>
          <gcds-breadcrumbs slot="breadcrumb">
            <gcds-breadcrumbs-item href="#">Design System</gcds-breadcrumbs-item>
            <gcds-breadcrumbs-item href="#">Components</gcds-breadcrumbs-item>
          </gcds-breadcrumbs>
        </gcds-header>
      </element-display>

      <element-display
        class="mt-300"
        attrs='[
          {
            "name": "button-id",
            "control": "text",
            "type": "string"
          },
          {
            "name": "button-role",
            "control": "select",
            "type": "string",
            "options": "[\"primary\", \"secondary\", \"danger\"]",
            "defaultValue": "primary"
          },
          {
            "name": "nope",
            "control": "none"
          }
        ]'
        slots='[
          {
            "name": "default",
            "description": "The default slot allows inputting the button label."
          }
        ]'
        events='[
          {
            "name": "gcdsBlur",
            "description": "Custom event that fires when the element loses focus",
            "details": "-"
          },
          {
            "name": "gcdsFocus",
            "description": "Custom event that fires when the element gains focus",
            "details": "-"
          }
        ]'
      >
        <gcds-button button-role="danger">Primary</gcds-button>
      </element-display>

      <element-display
        class="mt-300"
        attrs='[
          {
            "name": "label",
            "control": "text",
            "type": "string"
          },
          {
            "name": "input-id",
            "control": "text",
            "type": "string"
          },
          {
            "name": "type",
            "control": "select",
            "type": "string",
            "options": "[\"text\", \"email\", \"number\", \"url\", \"search\", \"password\"]",
            "defaultValue": "text"
          },
          {
            "name": "required",
            "control": "select",
            "type": "boolean",
            "options": "[\"true\", \"false\"]",
            "defaultValue": "false"
          }
        ]'
        events='[
          {
            "name": "gcdsBlur",
            "description": "Custom event that fires when the element loses focus",
            "details": "-"
          },
          {
            "name": "gcdsFocus",
            "description": "Custom event that fires when the element gains focus",
            "details": "-"
          }
        ]'
      >
        <gcds-input
          input-id="form-name"
          label="Name"
          hint="Please enter your full name."
        ></gcds-input>
      </element-display>

    </gcds-container>
  </body>
</html>

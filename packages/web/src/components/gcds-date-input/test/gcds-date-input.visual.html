<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Component preview: gcds-date-input</title>

    <!-- GCDS build -->
    <link rel="stylesheet" href="/build/gcds.css" />
    <script type="module" src="/build/gcds.esm.js"></script>

    <style>
      *,
      *::before,
      *::after {
        animation: none !important;
        box-sizing: border-box;
      }

      html {
        font-size: 16px;
      }

      body {
        background-color: var(--gcds-bg-white);
        color: var(--gcds-text-primary);
        font-family: var(--gcds-font-families-body), sans-serif;
        font-size: var(--gcds-font-sizes-text);
        line-height: var(--gcds-line-heights-text);
        margin: 0;
        padding: 0;
      }

      .preview-variant {
        margin-bottom: var(--gcds-spacing-600);
      }

      .preview-component {
        padding: var(--gcds-spacing-300);
      }
    </style>

    <style>
           /* Reset Styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      a {
        cursor: pointer;
        color: var(--gcds-link-default);
        text-decoration-style: solid;
        text-decoration-color: currentColor;
        text-decoration-thickness: var(--gcds-link-decoration-thickness);
        text-underline-offset: var(--gcds-link-underline-offset);
        transition: all 0.35s;

        @media (hover: hover) {
          &:hover {
            text-decoration-thickness: var(--gcds-link-hover-decoration-thickness);
          }
        }

        &:visited:not(:focus):not([class*='link-light']) {
          color: var(--gcds-link-visited);
        }

        &:focus {
          background-color: var(--gcds-link-focus-background);
          color: var(--gcds-link-focus-text);
          border-radius: var(--gcds-link-focus-border-radius);
          box-shadow: var(--gcds-link-focus-box-shadow);
          outline: var(--gcds-link-focus-outline-width) solid
            var(--gcds-link-focus-background);
          outline-offset: var(--gcds-link-focus-outline-offset);
          text-decoration: none;
        }
      }

      body {
        font: var(--gcds-font-text);
        color: var(--gcds-text-primary);

        @media only screen and (width < 48em) {
          font: var(--gcds-font-text-mobile);
        }
      }

      button {
        border: 0;
        cursor: pointer;

        &:disabled {
          cursor: not-allowed;
        }
      }

      code {
        font-family: var(--gcds-font-families-monospace);
      }

      fieldset {
        border: 0;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        text-wrap: balance;
        margin-block-end: var(--gcds-heading-spacing-300);
      }

      h2,
      h3,
      h4,
      h5,
      h6 {
        margin-block-start: var(--gcds-heading-spacing-600);
      }

      h1 {
        max-width: var(--gcds-heading-character-limit-h1);
        font: var(--gcds-heading-h1-desktop);
        margin-block-start: var(--gcds-heading-spacing-0);

        &:after {
          display: block;
          content: '';
          width: var(--gcds-heading-h1-border-width);
          margin-block-start: var(--gcds-heading-h1-border-margin);
          height: var(--gcds-heading-h1-border-height);
          background-color: var(--gcds-heading-h1-border-background);
        }

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h1-mobile);
        }
      }

      h2 {
        max-width: var(--gcds-heading-character-limit-h2);
        font: var(--gcds-heading-h2-desktop);

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h2-mobile);
        }
      }

      h3 {
        max-width: var(--gcds-heading-character-limit-h3);
        font: var(--gcds-heading-h3-desktop);

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h3-mobile);
        }
      }

      h4 {
        max-width: var(--gcds-heading-character-limit-h4);
        font: var(--gcds-heading-h4-desktop);

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h4-mobile);
        }
      }

      h5 {
        max-width: var(--gcds-heading-character-limit-h5);
        font: var(--gcds-heading-h5-desktop);

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h5-mobile);
        }
      }

      h6 {
        max-width: var(--gcds-heading-character-limit-h6);
        font: var(--gcds-heading-h6-desktop);

        @media only screen and (width < 48em) {
          font: var(--gcds-heading-h6-mobile);
        }
      }

      hr {
        border: var(--gcds-border-width-sm) solid var(--gcds-color-grayscale-300);
      }

      html {
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Prevent images from overflowing their container */
      img {
        max-width: 100%;
      }

      input,
      select,
      textarea {
        font-family: inherit;
        font-size: inherit;
      }

      /* Remove list styles */
      ol,
      ul {
        list-style: none;
      }

      p {
        max-width: var(--gcds-text-character-limit);
        font: var(--gcds-font-text);
        margin-block-start: var(--gcds-heading-spacing-0);
        margin-block-end: var(--gcds-heading-spacing-300);

        @media only screen and (width < 48em) {
          font: var(--gcds-font-text-mobile);
        }
      }

      small {
        font: var(--gcds-font-text-small);

        @media only screen and (width < 48em) {
          font: var(--gcds-font-text-small-mobile);
        }
      }

      strong {
        font-weight: var(--gcds-font-weights-bold);
      }

      /* Match table styles to table component */
      table {
        width: 100%;
        border-collapse: collapse;
        border-spacing: 0;
        border-block-start: var(--gcds-table-border-width) solid
          var(--gcds-table-outer-border-color);
        font: var(--gcds-table-font);
        color: var(--gcds-table-text);
        margin-block-start: var(--gcds-table-margin);

        th {
          font-weight: var(--gcds-table-header-cell-font-weight);
          text-align: left;
          color: var(--gcds-table-header-cell-text);
          border-block-end: var(--gcds-table-header-cell-border-width) solid
            var(--gcds-table-header-cell-border-color);
        }

        thead th {
          vertical-align: top;
        }

        tbody {
          tr,
          th {
            border-block-end: var(--gcds-table-border-width) solid
              var(--gcds-table-cell-border-color);
          }
        }

        /* If tbody contains row headers (th), add a vertical divider after the first column */
        @media only screen and (width >= 48em) {
          &:has(tbody th) thead th:first-child,
          tbody th {
            border-inline-end: var(--gcds-table-header-cell-border-width) solid
              var(--gcds-table-header-cell-border-color);
          }

          th,
          td {
            padding: var(--gcds-table-cell-padding-desktop);
          }
        }

        @media only screen and (width < 48em) {
          th,
          td {
            font-weight: var(--gcds-table-font-weight-mobile);
            padding: var(--gcds-table-cell-padding-mobile);

            &:first-of-type {
              padding-block-start: var(--gcds-table-cell-padding-mobile-first-last);
            }

            &:last-of-type {
              padding-block-end: var(--gcds-table-cell-padding-mobile-first-last);
            }
          }

          tbody th {
            border: 0;
          }
        }
      }
    </style>
  </head>

  <body>
    <main>
      <gcds-heading tag="h1">gcds-date-input</gcds-heading>

      <section data-variant="default" class="preview-variant">
        <gcds-heading tag="h2">Default</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="default"
            legend="Date input"
            format="full"
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="compact" class="preview-variant">
        <gcds-heading tag="h2">Format: compact</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="compact"
            legend="Date input"
            format="compact"
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="disabled" class="preview-variant">
        <gcds-heading tag="h2">Disabled</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="disabled"
            legend="Date input"
            format="full"
            disabled
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="error-message" class="preview-variant">
        <gcds-heading tag="h2">Error message</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="error"
            legend="Date input"
            format="full"
            error-message="Example error message."
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="hint" class="preview-variant">
        <gcds-heading tag="h2">Hint</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="hint"
            legend="Date input"
            format="full"
            hint="For example: 2024-01-01"
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="required" class="preview-variant">
        <gcds-heading tag="h2">Required</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="required"
            legend="Date input"
            format="full"
            required
          ></gcds-date-input>
        </div>
      </section>

      <section data-variant="value" class="preview-variant">
        <gcds-heading tag="h2">Value</gcds-heading>
        <div class="preview-component">
          <gcds-date-input
            name="value"
            legend="Date input"
            format="full"
            value="2024-01-01"
          ></gcds-date-input>
        </div>
      </section>
    </main>
  </body>
</html>

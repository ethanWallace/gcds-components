# WIP publish GitHub action

name: Publish NuGet
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: npm ci
      - run: npm run build 
      - run: npm run publish:nuget -w packages/dotnet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}